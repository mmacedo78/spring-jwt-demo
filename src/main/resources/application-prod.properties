# ===== Perfil PROD: PostgreSQL =====
# Tudo é lido de variáveis de ambiente. Sem DB_USERNAME, DB_PASSWORD ou JWT_SECRET
# a aplicação não sobe (falha rápida, em vez de rodar com credencial padrão).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/demodb}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false

# H2 console nunca em produção
spring.h2.console.enabled=false

# Swagger desligado por padrão em produção (ligue com SWAGGER_ENABLED=true)
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}

# Secret JWT em Base64 (mínimo 256 bits), obrigatório. Ex.: openssl rand -base64 48
app.jwt.secret=${JWT_SECRET}
